<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng tiếp nhận phản ánh giao thông</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:24px 14px;background:#f2f5f9;color:#1f2937}.card{max-width:620px;margin:20px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 5px 24px #102a4312}h1{text-align:center;color:#075bb5;font-size:23px;margin:4px 0 8px}.sub{text-align:center;color:#64748b;font-size:14px;margin:0 0 24px}.group{margin-bottom:16px}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}input,textarea,button{width:100%;font:inherit;padding:11px 12px;border:1px solid #cbd5e1;border-radius:7px}textarea{resize:vertical}input:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#2563eb}.hint{font-size:12px;color:#64748b;margin-top:5px}.btn{border:0;background:#075bb5;color:white;font-weight:700;cursor:pointer}.btn:hover{background:#064b94}.gps{background:#15803d;margin-top:7px}.gps:hover{background:#166534}.btn:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:15px;padding:12px;border-radius:7px;line-height:1.5}.ok{display:block;background:#ecfdf5;color:#166534}.err{display:block;background:#fef2f2;color:#991b1b}.footer{text-align:center;font-size:12px;color:#64748b;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<h1>BÁO CÁO BẤT CẬP GIAO THÔNG</h1>
<p class="sub">Cổng tiếp nhận thông tin phản ánh của người dân</p>
<form id="reportForm">
  <div class="group"><label for="fullName">Họ và tên người báo cáo (*)</label><input id="fullName" name="fullName" maxlength="120" required autocomplete="name" placeholder="Nhập họ tên"></div>
  <div class="group"><label for="phone">Số điện thoại liên hệ (*)</label><input id="phone" name="phone" type="tel" maxlength="20" required autocomplete="tel" placeholder="Nhập số điện thoại"></div>
  <div class="group"><label for="location">Vị trí / Địa điểm xảy ra sự cố (*)</label><input id="location" name="location" maxlength="500" required placeholder="Nhập địa chỉ hoặc lấy tọa độ GPS"><button class="btn gps" type="button" id="gpsBtn">📍 Lấy tọa độ GPS hiện tại</button><div class="hint">Định vị cần được cho phép trên trình duyệt và website phải sử dụng HTTPS.</div><input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude"></div>
  <div class="group"><label for="description">Nội dung phản ánh (*)</label><textarea id="description" name="description" rows="5" maxlength="3000" required placeholder="Mô tả chi tiết tình trạng giao thông, biển báo, ổ gà..."></textarea></div>
  <div class="group"><label for="media">Hình ảnh / Video minh chứng (*)</label><input id="media" name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" required><div class="hint">Chấp nhận JPG, PNG, WEBP, GIF, MP4, WEBM, MOV. Tối đa 20MB.</div></div>
  <button class="btn" id="submitBtn" type="submit">GỬI PHẢN ÁNH</button>
  <div id="message" class="status" role="status" aria-live="polite"></div>
</form>
<p class="footer">Thông tin được gửi đến hệ thống tiếp nhận phản ánh giao thông.</p>
</main>
<script>
const form=document.getElementById("reportForm"),gpsBtn=document.getElementById("gpsBtn"),message=document.getElementById("message");
function showMessage(text,type){message.textContent=text;message.className="status "+type}
gpsBtn.addEventListener("click",()=>{
 if(!navigator.geolocation){showMessage("Trình duyệt không hỗ trợ định vị GPS.","err");return}
 gpsBtn.disabled=true;gpsBtn.textContent="Đang xác định vị trí...";
 navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  document.getElementById("latitude").value=lat.toFixed(6);document.getElementById("longitude").value=lon.toFixed(6);
  document.getElementById("location").value=`Tọa độ: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
  gpsBtn.disabled=false;gpsBtn.textContent="✅ Đã lấy tọa độ";showMessage("Đã lấy tọa độ GPS. Bạn có thể tiếp tục gửi phản ánh.","ok");
 },()=>{
  gpsBtn.disabled=false;gpsBtn.textContent="📍 Lấy tọa độ GPS hiện tại";
  showMessage("Không lấy được GPS. Vui lòng cấp quyền định vị hoặc nhập địa chỉ bằng tay.","err");
 },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
});
form.addEventListener("submit",async e=>{
 e.preventDefault();const file=document.getElementById("media").files[0];if(!file)return;
 if(file.size>20*1024*1024){showMessage("Tệp vượt quá 20MB. Vui lòng chọn tệp nhỏ hơn.","err");return}
 const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="ĐANG GỬI...";
 try{
  const response=await fetch("/api/report",{method:"POST",body:new FormData(form)});
  const result=await response.json();if(!response.ok)throw new Error(result.message||"Không gửi được phản ánh.");
  showMessage(`${result.message} Mã phản ánh: ${result.reportId}. Vui lòng lưu mã này để tra cứu khi cần.`,"ok");
  form.reset();gpsBtn.textContent="📍 Lấy tọa độ GPS hiện tại";
 }catch(err){showMessage("Gửi phản ánh thất bại: "+err.message,"err")}
 finally{btn.disabled=false;btn.textContent="GỬI PHẢN ÁNH"}
});
</script>
</body>
</html>
